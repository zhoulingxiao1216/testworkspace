          outputs:
            result:
              type: string
          code_language: python3
          code: "import json, requests\ndef main(mysku, final_spec_id):\n    if isinstance(mysku,\
            \ list) and len(mysku) > 0: mysku = mysku[0]\n    if isinstance(mysku,\
            \ dict): \n        sku_str = mysku.get('mysku', '')\n        item_id_to_find\
            \ = str(mysku.get('item_id', ''))\n    else: \n        sku_str = ''\n\
            \        item_id_to_find = ''\n    \n    spec_id_to_find = str(final_spec_id)\
            \ if final_spec_id else ''\n    \n    if not sku_str or not item_id_to_find\
            \ or not spec_id_to_find:\n        return {\"result\": \"skipped (missing\
            \ info)\"}\n        \n    headers = {\n        \"authorization\": \"eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9..s-OurAj0yooRFDNYWczUjry8AZb2u7fFw6zeB0lWkXY\"\
            ,\n        \"userlogintoken\": \"eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9..BUMfHiBm2WzoqTOdptC0kFDIOHsMbBm8vAu2jS-_dDk\"\
            ,\n        \"content-type\": \"application/json\",\n        \"language\"\
            : \"korean\",\n        \"nation\": \"Korea\"\n    }\n    \n    try:\n\
            \        resp = requests.post(\"https://api.hubbuyer.com/api_b2b/cart/list\"\
            , json={}, headers=headers, timeout=10)\n        cart_data = resp.json()\n\
            \        \n        found_cart_detail_id = 0\n        seller_data_list\
            \ = cart_data.get('data', {}).get('seller_data', [])\n        for seller\
            \ in seller_data_list:\n            for item in seller.get('data', []):\n\
            \                item_match = str(item.get('item_id')) == item_id_to_find\n\
            \                spec_match = str(item.get('attribute', {}).get('specId'))\
            \ == spec_id_to_find\n                \n                if item_match\
            \ and spec_match:\n                    found_cart_detail_id = int(item.get('id',\
            \ 0))\n                    break\n            if found_cart_detail_id:\n\
            \                break\n                \n        if not found_cart_detail_id:\n\
            \            return {\"result\": \"skipped (cart_detail_id not found)\"\
            }\n            \n        payload = {\n            \"cart_detail_id\":\
            \ found_cart_detail_id,\n            \"custom_sku\": {\"sku\": sku_str},\n\
            \            \"amazon_sku\": {\n                \"sku\": sku_str,\n  \
            \              \"url\": \"\",\n                \"asin\": \"\",\n     \
            \           \"fnsku\": \"\",\n                \"child_id\": \"\"\n   \
            \         },\n            \"self_sku\": []\n        }\n        \n    \
            \    update_resp = requests.post(\"https://api.hubbuyer.com/api_b2b/cartQuoteStep1/updateSkuNumberData\"\
            , json=payload, headers=headers, timeout=10)\n        fjx_payload = {\n\
            \            \"cart_detail_id_arr\": [found_cart_detail_id],\n       \
            \     \"check_config_uuid\": \"C25-0617-8133\",\n            \"fjx_config_uuid_arr\"\
            : [\"F25-0821-5931\"],\n            \"user_fjx_config_uuid_arr\": []\n\
            \        }\n        fjx_resp = requests.post(\"https://api.hubbuyer.com/api_b2b/cartQuoteStep1/updateCheckFjx\"\
            , json=fjx_payload, headers=headers, timeout=10)\n        return {\"result\"\
            : f\"SKU: {update_resp.text} | FJX: {fjx_resp.text}\"}\n    except Exception\
            \ as e:\n        return {\"result\": str(e)}\n"
