            api_price:
              type: number
            excel_price:
              type: number
          code_language: python3
          code: "import json\ndef main(detail_body, excel_item):\n    if isinstance(excel_item,\
            \ list) and len(excel_item) > 0: excel_item = excel_item[0]\n    if isinstance(excel_item,\
            \ dict):\n        color_input = str(excel_item.get(\"color\", \"\")).strip()\n\
            \        size_input = str(excel_item.get(\"size\", \"\")).strip()\n  \
            \      excel_price = 0.0\n        try: excel_price = float(str(excel_item.get(\"\
            price\", \"0\")).replace(',', ''))\n        except: pass\n    else:\n\
            \        color_input, size_input, excel_price = \"\", \"\", 0.0\n    \
            \    \n    try:\n        if isinstance(detail_body, str): db = json.loads(detail_body)\n\
            \        elif isinstance(detail_body, list) and len(detail_body) > 0:\
            \ db = detail_body[0]\n        else: db = detail_body\n    except: return\
            \ {\"final_sku_id\": 0, \"final_spec_id\": \"\", \"product_index_uuid\"\
            : \"\", \"status\": \"JSON_PARSE_ERROR\", \"api_price\": 0.0, \"excel_price\"\
            : excel_price}\n    \n    if not isinstance(db, dict): db = {}\n    db_data\
            \ = db.get(\"data\", {})\n    if not isinstance(db_data, dict): db_data\
            \ = {}\n    inner = db_data.get(\"data\", {})\n    if not isinstance(inner,\
            \ dict): inner = {}\n    \n    uuid = str(inner.get(\"product_index_uuid\"\
            , \"\"))\n    sku_list = inner.get(\"productSkuInfos\", [])\n    if not\
            \ isinstance(sku_list, list): sku_list = []\n    \n    if not sku_list:\n\
            \        return {\"final_sku_id\": 0, \"final_spec_id\": \"\", \"product_index_uuid\"\
            : uuid, \"status\": \"NO_SKU_DATA\", \"api_price\": 0.0, \"excel_price\"\
            : excel_price}\n        \n    best_match = None\n    best_score = 0\n\
            \    for s in sku_list:\n        attrs_raw = s.get(\"skuAttributes\",\
            \ [])\n        attrs_text = \" \".join([str(a.get(\"value\", \"\")) for\
            \ a in attrs_raw]) if isinstance(attrs_raw, list) else str(attrs_raw)\n\
            \        \n        score = 0\n        if color_input and color_input in\
            \ attrs_text: score += 2\n        if size_input and size_input in attrs_text:\
            \ score += 2\n        if not size_input and color_input and color_input\
            \ in attrs_text: score += 1\n        if not color_input and size_input\
            \ and size_input in attrs_text: score += 1\n        \n        if score\
            \ > best_score:\n            best_score = score\n            best_match\
            \ = s\n            \n    if best_match and best_score >= 2:\n        api_price\
            \ = 0.0\n        try: api_price = float(best_match.get(\"consignPrice\"\
            ) or best_match.get(\"price\") or 0)\n        except: pass\n        \n\
            \        # 比价拦截逻辑\n        if api_price > excel_price + 0.01:\n      \
            \      return {\n                \"final_sku_id\": -1, # 故意填错让HTTP加购失败\n\
            \                \"final_spec_id\": str(best_match.get(\"specId\") or\
            \ \"\"),\n                \"product_index_uuid\": uuid,\n            \
            \    \"status\": \"PRICE_CHANGED\",\n                \"api_price\": api_price,\n\
            \                \"excel_price\": excel_price\n            }\n       \
            \ else:\n            return {\n                \"final_sku_id\": int(best_match.get(\"\
            skuId\") or 0),\n                \"final_spec_id\": str(best_match.get(\"\
            specId\") or \"\"),\n                \"product_index_uuid\": uuid,\n \
            \               \"status\": \"MATCHED\",\n                \"api_price\"\
            : api_price,\n                \"excel_price\": excel_price\n         \
            \   }\n    \n    return {\"final_sku_id\": 0, \"final_spec_id\": \"\"\
            , \"product_index_uuid\": uuid, \"status\": \"FALLBACK\", \"api_price\"\
            : 0.0, \"excel_price\": excel_price}"
