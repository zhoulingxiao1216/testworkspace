              type: number
          code_language: python3
          code: "import re, datetime, random\ndef main(text: str):\n    now = datetime.datetime.now()\n\
            \    dynamic_uuid = now.strftime(\"%Y%m%d%H%M%S\") + str(random.randint(10,\
            \ 99))\n    lines = text.strip().split('\\n')\n    if len(lines) < 3:\
            \ return {\"order_list\": [], \"message\": \"数据不足\", \"total\": 0}\n \
            \   order_list = []\n    for idx, line in enumerate(lines[2:], 3):\n \
            \       cols = [c.strip() for c in line.split('|')]\n        if len(cols)\
            \ < 6: continue\n        it_m = re.search(r'offer/(\\d+)', cols[1])\n\
            \        if not it_m: continue\n        \n        mysku = cols[7] if len(cols)\
            \ > 7 else ''\n        if mysku == 'nan': mysku = ''\n        num_str\
            \ = cols[5] if len(cols) > 5 else '1'\n        \n        order_list.append({\n\
            \            \"item_id\": it_m.group(1), \n            \"size\": cols[2]\
            \ if len(cols) > 2 else '',\n            \"color\": cols[3] if len(cols)\
            \ > 3 else '',\n            \"price\": cols[4] if len(cols) > 4 else '0',\n\
            \            \"quantity\": int(float(num_str)) if num_str.replace('.','').isdigit()\
            \ else 1,\n            \"mysku\": mysku,\n            \"row\": idx\n \
            \       })\n    return {\"order_list\": order_list, \"message\": f\"解析成功:\
            \ {len(order_list)}条\", \"total\": len(order_list)}"
