<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>清除本地存储</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 40px;
    }
    .btn {
      display: inline-block;
      padding: 12px 24px;
      background: #4080ff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #3070ef;
    }
    .success {
      color: #52c41a;
      margin-top: 20px;
    }
    .error {
      color: #ff4d4f;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>清除工单系统本地存储</h1>
    <p style="color:#666;margin:20px 0;">检测到页面加载出现内存溢出错误，这通常是由于浏览器本地存储中的数据损坏导致的。</p>
    <p style="color:#666;margin:20px 0;">点击下方按钮清除本地存储数据，然后重新访问工单页面。</p>
    <button class="btn" onclick="clearStorage()">清除本地存储</button>
    <div id="message"></div>
    <p style="margin-top:30px;font-size:14px;color:#999;">
      <a href="我的待办.html" style="color:#4080ff;">返回工单页面</a>
    </p>
  </div>

  <script>
    function clearStorage() {
      try {
        [
          'global-v2-workorder-simple-flow',
          'global-v2-workorder-simple-flow-v1',
          'global-v2-workorder-simple-flow-v2',
          'global-v2-workorder-simple-flow-v3',
          'global-v2-workorder-simple-flow-v4',
          'global-v2-workorder-simple-flow-v5',
          'global-v2-workorder-simple-flow-v6',
          'global-v2-workorder-simple-flow-v7',
          'global-v2-workorder-simple-flow-v8',
          'global-v2-workorder-simple-flow-v9'
        ].forEach(function (key) {
          localStorage.removeItem(key);
        });
        document.getElementById('message').innerHTML = '<p class="success">✓ 本地存储已清除成功！</p>';
      } catch (e) {
        document.getElementById('message').innerHTML = '<p class="error">✗ 清除失败: ' + e.message + '</p>';
      }
    }
  </script>
</body>
</html>
