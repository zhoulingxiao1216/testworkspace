prerequisites:
  accounts:
    credentials_file: 00_全局测试规约库/测试环境使用账号.md
    - type: admin
      count: 1
      desc: 管理端全权限，用于 NP/IV/WB/PM/SH/OD 管理端用例
    - type: normal_user
      count: 2
      desc: 用户A + 用户B，有实际订单，用于归属判断和隔离测试
    - type: japan_user
      count: 1
      desc: 日本籍用户，用于 §11 多语言标签验证
    - type: non_japan_user
      count: 1
