      requirement: 至少1单含2+不同订单的商品
      purpose: §5 跨订单合并验证
    - item: 7182客户订单
      requirement: 至少1单关联樱花站客户
      purpose: §6 ID映射转换 (JPN7182)
    - item: 进口商地址场景
      requirement: 4种（相同/null/空字符串/正常）
      purpose: §8 流通王 SAME AS CONSIGNEE
    - item: 商品数据
      requirement: 3+种商品，含中英品名/材质/SKU/图片
      purpose: PM模块 + 表单字段填充
    - item: 箱子二维码
      requirement: 至少2个有效箱子
      purpose: MV扫码核对全流程
    - item: Excel模板文件
      requirement: 28个PM提供的原始模板
      purpose: §10 模板交叉验证
    - item: 字段获取.json
      requirement: PRD目录下
      purpose: FD-016/SH-005/OD-004/OD-005 JSON校验

  devices:
    - type: mobile
      desc: 手机浏览器或Chrome DevTools 375px模拟
      for: MV模块
    - type: pc
      desc: PC浏览器
      for: PV/FD/NP/IV/WB/PM/SH/OD模块

  blocking_risks:
