execution_rounds:
  - round: R0
    name: 设计评审与授权确认
    scope:
      - 校验 P0/P1/P2/P3 范围
      - 校验测试账号、资金样本、万里汇沙箱、IM 房间、扩展包、日志权限
      - 确认哪些安全用例允许执行，哪些只做代码审计
    execute_cases: false
  - round: R1
    name: P0/P1 Smoke 冒烟候选
    scope:
      - 越权退款
      - 万里汇验签
      - 提现支付密码
      - 余额调整审批
      - admin_index 鉴权
      - SSO 白名单
      - 凭证失败频控
      - 地址和报价 IDOR
      - WebSocket 身份
      - IM XSS
      - 私钥访问
      - 扩展权限和内网 URL 拒绝
      - 代客登录审计
    candidate_cases: 23
    execute_cases: false
  - round: R2
    name: 全量安全专项候选
    scope:
      - 资金与支付安全
      - 鉴权与访问控制
      - 资源归属与 IDOR
      - IM 与消息安全
      - XSS 与注入防护
      - 密钥与敏感数据
      - Chrome 扩展与本地组件
      - 审计与纵深防御
    candidate_cases: 52
    execute_cases: false
  - round: R3
    name: 条件项专项候选
    scope:
      - 真实退款和支付沙箱回调
      - WorldTrade 密钥轮换
      - WebSocket 脚本构造
      - Chrome 扩展打包验证
      - 内网和 link-local URL 拒绝
      - Lodop 本地打印消息模拟
    candidate_cases: 21
    execute_cases: false
  - round: R4
    name: 缺陷复测与上线门禁
    scope:
      - 缺陷关联用例
      - P0 Smoke 全量复测
      - Critical/High 遗留项归零审计
    candidate_cases: dynamic
    execute_cases: false

