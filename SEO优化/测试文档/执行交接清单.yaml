agent2_instruction:
  role: Agent2 / Execution Reviewer
  execute_cases: false
  instruction:
    - 不执行真实测试用例，不修改生产或测试环境 SEO 配置，除非后续用户明确授权
    - 先做可执行性评审，核对环境、后台账号、分类样本、产品样本、旧 URL 样本、多语言样本
    - 执行时优先使用 curl、查看源代码、结构化数据解析和 HTTP 状态码验证，不只依据浏览器 DOM
    - 对 conditional_cases 标记 Conditional 或 Blocked，不作为阻断缺陷直接提交
    - 若需要修改 slug、title、description，仅在测试环境和获得配置写入授权后执行
    - 输出评审或执行结果时保留用例锚点 ID，便于回链到测试用例文档

