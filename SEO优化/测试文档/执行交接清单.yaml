execution_rounds:
  - round: R0
    name: 设计评审
    scope:
      - 校验需求范围是否只覆盖首页、产品分类页、产品详情页
      - 校验模块缩写和用例锚点格式
      - 确认 URL 生成规则、多语言范围、Schema 字段来源
    execute_cases: false
  - round: R1
    name: Smoke 冒烟候选
    scope:
      - 首页 title 和 description 可读取
      - 分类页和产品页规范 URL
      - 产品页 Product Schema
      - hreflang 多语言互链
      - robots 和 sitemap 核心入口
    candidate_cases: 13
    execute_cases: false
  - round: R2
    name: 全量功能候选
    scope:
      - 元信息可爬取
      - URL 伪静态
      - 产品分类页 SEO
      - 产品详情页 SEO
      - 多语言与 Schema.org
      - 安全回归与爬虫入口
    candidate_cases: 40
    execute_cases: false
  - round: R3
    name: 条件项专项候选
    scope:
      - 旧 URL 301 跳转
      - 分页、筛选、排序 canonical 或 noindex
      - Product Schema 价格、币种、库存字段
      - 下架或禁用产品 SEO 策略
      - 多语言范围和 x-default
      - sitemap 纳入范围
    candidate_cases: 15
    execute_cases: false
  - round: R4
    name: 缺陷回归候选
    scope:
      - 缺陷关联用例
      - Smoke 用例
      - URL、canonical、sitemap 联动复核
    candidate_cases: dynamic
    execute_cases: false

