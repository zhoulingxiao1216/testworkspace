<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streamlit Native Custom Tree</title>
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --bg-base: #0b0f19;
            --bg-surface: #151a2a;
            --bg-hover: #262d40;
            --border: #333d54;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --brand: #3b82f6; 
            --success: #10b981;
            --danger: #ef4444;
            --pending: #f59e0b;
        }

        body {
            background-color: var(--bg-surface);  /* match card bg */
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.5;
            overflow-y: auto; 
            overflow-x: hidden;
        }

        .tree-view {
            padding: 0.5rem;
            max-height: 85vh;
            overflow-y: auto;
        }
        
        /* 自定义暗黑版滚动条 */
        .tree-view::-webkit-scrollbar {
            width: 6px;
        }
        .tree-view::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.1); 
            border-radius: 8px;
        }
        .tree-view::-webkit-scrollbar-thumb {
            background: var(--border); /* 默认偏黑灰色 */
            border-radius: 8px;
            transition: background 0.2s;
        }
        .tree-view::-webkit-scrollbar-thumb:hover {
            background: var(--brand); /* 悬停时变成品牌蓝色 */
        }

        .search-box {
            position: sticky;
            top: 0;
            z-index: 10;
            padding: 0.4rem 0.5rem;
            background: var(--bg-surface);
        }
        .search-box input {
            width: 100%;
            box-sizing: border-box;
            padding: 0.5rem 0.7rem 0.5rem 2rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg-base);
            color: var(--text-primary);
            font-size: 0.85rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-box input::placeholder { color: var(--text-muted); }
        .search-box input:focus { border-color: var(--brand); }
        .search-box .search-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.8rem;
            pointer-events: none;
        }

        .tree-item {
            padding: 0.5rem 0.6rem;
            cursor: pointer;
            border-radius: 8px;
            display: flex;
            align-items: center;
            color: var(--text-secondary);
            transition: all 0.2s;
            user-select: none;
            font-size: 0.9rem;
            margin: 2px 0;
            position: relative;
        }

        .tree-item:hover { 
            background: var(--bg-hover); 
            color: var(--text-primary); 
        }
        
        .tree-item.active {
            background: rgba(59, 130, 246, 0.15);
            color: var(--brand);
            border-left: 3px solid var(--brand);
            border-radius: 0 8px 8px 0;
            font-weight: 500;
        }

        /* Level Specific Tweaks matching Mockup styling rules */
        .tree-item.level-side { font-weight: 600; color: var(--text-primary); font-size: 0.95rem; }
        .tree-item.level-mg { font-weight: 500; }

        .chevron {
            margin-right: 0.4rem;
            font-size: 0.8rem;
            width: 16px;
            text-align: center;
            transition: transform 0.2s;
            color: var(--text-muted);
        }
        .tree-item.expanded > .chevron {
            transform: rotate(90deg);
        }
        .chevron.invisible { visibility: hidden; }

        .icon {
            margin-right: 0.6rem;
            font-size: 0.9rem;
            width: 14px;
            text-align: center;
        }

        .status-dot {
            width: 8px; height: 8px; border-radius: 50%; margin-left: auto; flex-shrink: 0;
        }
        .status-dot.success { background: var(--success); box-shadow: 0 0 5px var(--success); }
        .status-dot.danger { background: var(--danger); box-shadow: 0 0 5px var(--danger); }
        .status-dot.pending { background: var(--pending); }

        .progress-bar-bg {
            position: absolute; bottom: 0; left: 0; right: 0; height: 2px;
            background: var(--bg-hover); border-radius: 0 0 8px 8px; overflow: hidden;
        }
        .progress-bar-fill { height: 100%; background: var(--brand); transition: width 0.3s; }

        /* The Nested Children line logic matching your mockup */
        .tree-children {
            padding-left: 1.2rem;
            margin-left: 0.6rem;
            border-left: 1px dashed var(--border);
            display: none;
        }
        .tree-children.expanded {
            display: block;
        }

        .tc-title {
            word-wrap: break-word; 
            font-size: 0.85rem;
            line-height: 1.3;
        }
        .tc-label { font-family: monospace; font-size: 0.65rem; color: var(--text-muted); opacity: 0.8; margin-bottom: 2px;}

    </style>
</head>
<body>
    <div class="search-box" style="position:relative;">
        <i class="fas fa-search search-icon"></i>
        <input id="tree-search" type="text" placeholder="搜索用例 ID 或标题…" oninput="filterTree(this.value)">
    </div>
    <div id="tree-root" class="tree-view">
        <!-- Rendered by JS -->
    </div>

    <!-- Communication Interface -->
    <script>
        function sendMessageToStreamlitClient(type, data) {
            const outData = Object.assign({
                isStreamlitMessage: true,
                type: type,
            }, data);
            window.parent.postMessage(outData, "*");
        }

        const Streamlit = {
            setComponentReady: function() {
                sendMessageToStreamlitClient("streamlit:componentReady", {apiVersion: 1});
            },
            setFrameHeight: function(height) {
                sendMessageToStreamlitClient("streamlit:setFrameHeight", {height: height || document.body.scrollHeight});
            },
            setComponentValue: function(value) {
                sendMessageToStreamlitClient("streamlit:setComponentValue", {value: value});
            }
        };

        window.addEventListener("message", function(event) {
            if (event.data.type === "streamlit:render") {
                onDataFromPython(event.data.args);
            }
        });

        // Global State tracking inside JS allows fast toggling without python reload
        let globalSelectedId = null;
        let userExpandedNodes = new Set();
        let userCollapsedNodes = new Set();

        function toggleNode(nodeId, event) {
            event.stopPropagation();
            const childDiv = document.getElementById(`children-${nodeId}`);
            const itemDiv = document.getElementById(`item-${nodeId}`);
            if (childDiv) {
                const isExpanded = childDiv.classList.contains('expanded');
                if (isExpanded) {
                    childDiv.classList.remove('expanded');
                    itemDiv.classList.remove('expanded');
                    userExpandedNodes.delete(nodeId);
                    userCollapsedNodes.add(nodeId);
                } else {
                    childDiv.classList.add('expanded');
                    itemDiv.classList.add('expanded');
                    userExpandedNodes.add(nodeId);
                    userCollapsedNodes.delete(nodeId);
                    
                    // Use multiple timeouts to reliably auto-fit the iframe after browser repaints
                    setTimeout(()=>{ Streamlit.setFrameHeight() }, 10);
                    setTimeout(()=>{ Streamlit.setFrameHeight() }, 100);
                }
            }
            Streamlit.setFrameHeight();
        }

        function selectLeaf(tc_id, event) {
            event.stopPropagation();
            
            // Remove previous active
            document.querySelectorAll('.tree-item.active').forEach(el => el.classList.remove('active'));
            
            // Add new active
            const itemDiv = document.getElementById(`item-leaf-${tc_id}`);
            if(itemDiv) itemDiv.classList.add('active');
            
            globalSelectedId = tc_id;
            Streamlit.setComponentValue(tc_id);
        }

        function createTreeNodeHTML(node, pathId) {
            // node properties: type ('side', 'mg', 'tp', 'case'), label, title, status, pct, children, id
            if (node.type === "case") {
                const isActive = (globalSelectedId === node.id) ? "active" : "";
                let statusCls = "pending";
                if(node.status === "Pass") statusCls = "success";
                if(node.status === "Fail") statusCls = "danger";

                return `
                <div class="tree-item level-case ${isActive}" id="item-leaf-${node.id}" onclick="selectLeaf(${node.id}, event)" style="align-items: flex-start; padding: 0.6rem 0.6rem;">
                    <i class="chevron invisible fas fa-caret-right" style="margin-top:2px;"></i>
                    <i class="icon fas fa-file-alt" style="margin-top:2px;"></i>
                    <div style="display: flex; flex-direction: column; flex-grow: 1; overflow: hidden; margin-left: 0.2rem;">
                        <span class="tc-label">${node.label}</span>
                        <span class="tc-title">${node.title}</span>
                    </div>
                    <div class="status-dot ${statusCls}" style="margin-top:4px;"></div>
                </div>
                `;
            }

            // Groups (side, mg, tp)
            const childrenHTML = (node.children || []).map((c, i) => createTreeNodeHTML(c, pathId + "-" + i)).join("");
            
            let iconClass = "fa-folder";
            if (node.type === "side") iconClass = "fa-folder-tree";
            if (node.type === "mg") iconClass = "fa-box";
            if (node.type === "tp") iconClass = "fa-cube";

            let progressBar = "";
            if (node.type === "side" && node.pct !== undefined) {
                progressBar = `<div class="progress-bar-bg"><div class="progress-bar-fill" style="width: ${node.pct}%"></div></div>`;
            }

            // Expand L1 (side) and L2 (mg) by default for better UX initially, or just rely on CSS
            const isDefaultOpen = (node.type === "side" || node.type === "mg");
            let isInitialExpanded = "";
            
            if (userExpandedNodes.has(pathId)) {
                isInitialExpanded = "expanded";
            } else if (userCollapsedNodes.has(pathId)) {
                isInitialExpanded = "";
            } else if (isDefaultOpen) {
                isInitialExpanded = "expanded";
            }
            
            return `
            <div class="tree-item level-${node.type} ${isInitialExpanded}" id="item-${pathId}" onclick="toggleNode('${pathId}', event)">
                <i class="chevron fas fa-caret-right"></i>
                <i class="icon fas ${iconClass}"></i>
                <span class="tc-title">${node.title}</span>
                ${progressBar}
            </div>
            <div class="tree-children ${isInitialExpanded}" id="children-${pathId}">
                ${childrenHTML}
            </div>
            `;
        }

        function onDataFromPython(data) {
            let selectionChanged = false;
            if(data.selected_id && data.selected_id !== globalSelectedId) {
                globalSelectedId = data.selected_id;
                selectionChanged = true;
            }

            let html = "";
            if (data.tree_data && data.tree_data.length > 0) {
                data.tree_data.forEach((sideNode, index) => {
                    html += createTreeNodeHTML(sideNode, "root-" + index);
                });
            }

            document.getElementById("tree-root").innerHTML = html || "<span style='color:var(--text-muted);font-size:0.9rem;'>暂无关联用例</span>";
            
            // 如果搜索框有内容，重建后重新应用过滤
            const searchInput = document.getElementById('tree-search');
            if (searchInput && searchInput.value.trim()) {
                filterTree(searchInput.value);
            }

            // --- 选中项变更时自动回收与展开、滚动视图 ---
            if (selectionChanged && globalSelectedId) {
                const targetLeaf = document.getElementById(`item-leaf-${globalSelectedId}`);
                if (targetLeaf) {
                    // 1. 清除用户手动展开的记录，避免切换节点时旧数据干扰
                    userExpandedNodes.clear();
                    userCollapsedNodes.clear();

                    // 2. 将所有用例组折叠回收
                    document.querySelectorAll('.tree-children').forEach(el => el.classList.remove('expanded'));
                    document.querySelectorAll('.tree-item:not(.level-case)').forEach(el => el.classList.remove('expanded'));
                    
                    // 3. 逐层向上查找父级并强制展开当前选中路径
                    let parent = targetLeaf.parentElement;
                    while (parent) {
                        if (parent.classList.contains('tree-children')) {
                            parent.classList.add('expanded');
                            let pathId = parent.id.replace('children-', '');
                            userExpandedNodes.add(pathId); // 记入缓存，防止下一次无更换重绘时被合上

                            const parentToggle = document.getElementById('item-' + pathId);
                            if (parentToggle) parentToggle.classList.add('expanded');
                        }
                        parent = parent.parentElement;
                    }

                    // 4. 滚动到视野中 (使用 nearest 防止连续点击下一条时屏幕剧烈跳动)
                    setTimeout(() => {
                        targetLeaf.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                    }, 100);
                }
            }

            // iframe 内 window.innerHeight 会随着 iframe 高度萎缩而变成 0
            // 因此采用一个相对安全的固定大屏高度 (比如 650px) 让其稳如泰山
            setTimeout(() => {
                Streamlit.setFrameHeight(650);
            }, 100);
        }

        // ── 模糊搜索过滤 ────────────────────────────────────────
        function filterTree(query) {
            const q = query.trim().toLowerCase();
            const allCases = document.querySelectorAll('.tree-item.level-case');
            const allGroups = document.querySelectorAll('.tree-children');

            if (!q) {
                // 清空搜索：恢复所有节点可见，保持用户手动展开状态
                allCases.forEach(el => el.style.display = '');
                // Restore expand state from user interaction sets
                allGroups.forEach(g => {
                    const id = g.id.replace('children-', '');
                    if (userExpandedNodes.has(id)) {
                        g.classList.add('expanded');
                    } else if (userCollapsedNodes.has(id)) {
                        g.classList.remove('expanded');
                    }
                });
                Streamlit.setFrameHeight(document.getElementById('tree-root').scrollHeight + 60);
                return;
            }

            // 先隐藏所有用例和折叠所有组
            allCases.forEach(el => el.style.display = 'none');
            allGroups.forEach(g => g.classList.remove('expanded'));

            // 匹配并展开父链
            allCases.forEach(el => {
                const label = (el.querySelector('.tc-label')?.textContent || '').toLowerCase();
                const title = (el.querySelector('.tc-title')?.textContent || '').toLowerCase();
                if (label.includes(q) || title.includes(q)) {
                    el.style.display = '';
                    // 向上展开所有父 .tree-children
                    let parent = el.parentElement;
                    while (parent) {
                        if (parent.classList.contains('tree-children')) {
                            parent.classList.add('expanded');
                            // Also expand the toggle item
                            const itemId = parent.id.replace('children-', '');
                            const itemEl = document.getElementById('item-' + itemId);
                            if (itemEl) itemEl.classList.add('expanded');
                        }
                        parent = parent.parentElement;
                    }
                }
            });

            // 同时匹配父节点标题（模块组/测试点名称）
            document.querySelectorAll('.tree-item:not(.level-case)').forEach(groupItem => {
                const groupTitle = (groupItem.querySelector('.tc-title')?.textContent || '').toLowerCase();
                if (groupTitle.includes(q)) {
                    // 展开该组并显示所有子用例
                    const childrenId = groupItem.id.replace('item-', 'children-');
                    const childrenDiv = document.getElementById(childrenId);
                    if (childrenDiv) {
                        childrenDiv.classList.add('expanded');
                        groupItem.classList.add('expanded');
                        childrenDiv.querySelectorAll('.tree-item.level-case').forEach(c => c.style.display = '');
                        // Expand nested children too
                        childrenDiv.querySelectorAll('.tree-children').forEach(g => g.classList.add('expanded'));
                    }
                    // Expand parents
                    let parent = groupItem.parentElement;
                    while (parent) {
                        if (parent.classList.contains('tree-children')) {
                            parent.classList.add('expanded');
                            const pid = parent.id.replace('children-', '');
                            const pItem = document.getElementById('item-' + pid);
                            if (pItem) pItem.classList.add('expanded');
                        }
                        parent = parent.parentElement;
                    }
                }
            });

            Streamlit.setFrameHeight(650);
        }

        Streamlit.setComponentReady();
    </script>
</body>
</html>
