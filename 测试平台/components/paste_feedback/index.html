<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <style>
    html, body { margin: 0; padding: 0; background: transparent; color: #f8fafc; font-family: Inter, "Microsoft YaHei", Arial, sans-serif; }
    .paste-box {
      min-height: 168px; border: 1px solid #334155; border-radius: 8px;
      background: #f1f5f9; color: #0f172a; padding: 14px; outline: none;
      overflow: auto; line-height: 1.6; font-size: 15px; box-sizing: border-box;
    }
    .paste-box:focus { border-color: #ef4444; box-shadow: 0 0 0 1px #ef4444 inset; }
    .paste-box:empty::before { content: attr(data-placeholder); white-space: pre-line; color: #9ca3af; pointer-events: none; }
    .preview-strip { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .preview-strip img { width: 120px; height: 72px; border: 1px solid #334155; border-radius: 6px; object-fit: cover; background: #0f172a; }
    .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 8px; color: #cbd5e1; font-size: 13px; }
    button { border: 1px solid #334155; border-radius: 6px; background: #0f172a; color: #f8fafc; padding: 6px 12px; cursor: pointer; font-size: 13px; }
    button:hover { border-color: #3b82f6; color: #93c5fd; }
  </style>
</head>
<body>
  <div id="pasteBox" class="paste-box" contenteditable="true"
    data-placeholder="在这里直接粘贴业务反馈文字，也可以 Ctrl+V 粘贴截图。
例如：8099 客户入金，只提交了一笔，实际生成了两笔一模一样的钱。"></div>
  <div id="previewStrip" class="preview-strip"></div>
  <div class="toolbar">
    <span id="status">支持文字、截图、网页图片复制后直接粘贴。</span>
    <button id="clearBtn" type="button">清空</button>
  </div>
  <script>
    const box = document.getElementById("pasteBox");
    const previewStrip = document.getElementById("previewStrip");
    const statusEl = document.getElementById("status");
    const clearBtn = document.getElementById("clearBtn");
    let initialized = false;

    function sendMessage(type, data) {
      window.parent.postMessage({ isStreamlitMessage: true, type, ...data }, "*");
    }
    function setFrameHeight() {
      sendMessage("streamlit:setFrameHeight", { height: Math.max(260, document.documentElement.scrollHeight + 8) });
    }
    function setComponentValue(value) {
      sendMessage("streamlit:setComponentValue", { value, dataType: "json" });
      setFrameHeight();
    }
    function currentValue() {
      const images = Array.from(previewStrip.querySelectorAll("img")).map((img, index) => ({
        name: img.dataset.name || `clipboard_${index + 1}.png`,
        type: img.dataset.type || "image/png",
        data_url: img.src,
      }));
      statusEl.textContent = images.length ? `已粘贴 ${images.length} 张截图。` : "支持文字、截图、网页图片复制后直接粘贴。";
      return { text: box.innerText.trim(), images };
    }
    function update() { setComponentValue(currentValue()); }
    function insertText(text) {
      if (!text) return;
      const selection = window.getSelection();
      if (!selection || !selection.rangeCount) { box.append(document.createTextNode(text)); return; }
      const range = selection.getRangeAt(0);
      range.deleteContents();
      range.insertNode(document.createTextNode(text));
      range.collapse(false);
      selection.removeAllRanges();
      selection.addRange(range);
    }
    function insertImage(dataUrl, name, type) {
      const img = document.createElement("img");
      img.src = dataUrl;
      img.dataset.name = name || `clipboard_${Date.now()}.png`;
      img.dataset.type = type || "image/png";
      previewStrip.appendChild(img);
    }
    function fileToDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }
    box.addEventListener("paste", async (event) => {
      const clipboard = event.clipboardData;
      if (!clipboard) return;
      const imageItems = Array.from(clipboard.items || []).filter((item) => item.type && item.type.startsWith("image/"));
      const text = clipboard.getData("text/plain");
      if (!imageItems.length) return;
      event.preventDefault();
      insertText(text);
      for (const item of imageItems) {
        const file = item.getAsFile();
        if (!file) continue;
        const dataUrl = await fileToDataUrl(file);
        const ext = file.type.includes("jpeg") ? "jpg" : "png";
        insertImage(dataUrl, file.name || `clipboard_${Date.now()}.${ext}`, file.type);
      }
      update();
    });
    box.addEventListener("input", update);
    clearBtn.addEventListener("click", () => { box.innerHTML = ""; previewStrip.innerHTML = ""; update(); });
    window.addEventListener("message", (event) => {
      if (event.data.type !== "streamlit:render" || initialized) return;
      initialized = true;
      const defaultValue = (event.data.args || {}).default || {};
      if (defaultValue.text) box.textContent = defaultValue.text;
      if (Array.isArray(defaultValue.images)) {
        for (const image of defaultValue.images) if (image && image.data_url) insertImage(image.data_url, image.name, image.type);
      }
      update();
      setFrameHeight();
    });
    sendMessage("streamlit:componentReady", { apiVersion: 1 });
    setFrameHeight();
  </script>
</body>
</html>
